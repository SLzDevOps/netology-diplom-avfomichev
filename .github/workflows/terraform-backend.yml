name: 'Terraform backend'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/backend/**'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "true" to apply infrastructure changes'
        required: false
        default: "false"

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    env:
      CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}
      SSH_PUBLIC: ${{ secrets.SSH_PUBLIC }}
      SSH_PRIVATE: ${{ secrets.SSH_PRIVATE }}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.12.2"

    - name: Terraform Init
      run: |
        terraform -chdir=./terraform/backend init \
          -backend-config="access_key=${{env.ACCESS_KEY}}" \
          -backend-config="secret_key=${{env.SECRET_KEY}}"

    - name: Terraform Validate
      run: terraform -chdir=./terraform/backend validate

    - name: Terraform Plan
      run: |
        terraform -chdir=./terraform/backend plan -input=false -out=tfplan \
        -var="cloud_id=${{ secrets.YC_CLOUD_ID }}" \
        -var="folder_id=${{ secrets.YC_FOLDER_ID }}" \
        -var="service_account_key_file=${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}" \
        -var="ssh_public_key=${{ secrets.SSH_PUBLIC }}" \
        -var="ssh_private_key=${{ secrets.SSH_PRIVATE }}"

    - name: Terraform Apply (Manual Trigger)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
      run: terraform -chdir=./terraform/backend apply -input=false tfplan
