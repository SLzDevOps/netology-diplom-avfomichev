name: 'Terraform bucket'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/service-account-S3/**'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "true" to apply bucket changes'
        required: false
        default: 'false'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    env:
      CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.12.2"

    - name: Terraform Init
      run: terraform -chdir=./terraform/service-account-S3 init

    - name: Terraform Validate
      run: terraform -chdir=./terraform/service-account-S3 validate

    - name: Terraform Plan
      run: |
        cd ./terraform/service-account-S3
        terraform plan -input=false -out=tfplan \
        -var="cloud_id=${{ secrets.YC_CLOUD_ID }}" \
        -var="folder_id=${{ secrets.YC_FOLDER_ID }}" \
        -var="service_account_key_file=${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}"

    - name: Terraform Apply (Manual Trigger)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
      run: |
        cd ./terraform/service-account-S3
        terraform apply -input=false tfplan
