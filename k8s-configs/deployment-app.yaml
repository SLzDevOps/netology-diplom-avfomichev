apiVersion: apps/v1
kind: Deployment
metadata:
  name: avfomichev-test-app
  namespace: test-application
  labels:
    app: avfomichev-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avfomichev-web-app
  template:
    metadata:
      labels:
        app: avfomichev-web-app
    spec:
      containers:
      - name: avfomichev-test-app
        image: nginx:alpine
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "500m"
            memory: "200Mi"
        ports:
        - containerPort: 80
